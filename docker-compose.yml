version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smm_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-secret}
      MYSQL_DATABASE: ${DB_NAME:-smm_db}
      MYSQL_USER: ${DB_USER:-smm_user}
      MYSQL_PASSWORD: ${DB_PASS:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web_panel:
    build: 
      context: ./web_panel_php
    container_name: smm_web_panel
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-smm_user}
      - DB_PASS=${DB_PASS:-secret}
      - DB_NAME=${DB_NAME:-smm_db}

  python_worker:
    build:
      context: ./backend_python
    container_name: smm_python_worker
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-smm_user}
      - DB_PASS=${DB_PASS:-secret}
      - DB_NAME=${DB_NAME:-smm_db}

volumes:
  db_data:
